name: Flutter CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name family_home_manager --org com.yunfei.family .

      - name: Patch Android permissions
        run: dart run tool/patch_android_permissions.dart

      - name: Patch Android reminders
        run: dart run tool/patch_android_reminders.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-home-manager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error


  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync server dependencies
        working-directory: server
        run: pip install -r requirements.txt

      - name: Test sync server
        run: pytest -q server/test_app.py

      - name: Build sync server image
        run: docker build -t family-home-manager-sync ./server

      - name: Smoke test sync server container
        run: |
          docker run -d --name fhm-sync-ci -p 8787:8787 family-home-manager-sync
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs fhm-sync-ci
          exit 1
